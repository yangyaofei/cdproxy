# 发布管线：push tag v*（或手动 workflow_dispatch 指定 tag）
#   1. release（ubuntu-latest）：CLI 质量门禁 + GoReleaser 全平台 CLI（darwin/linux/windows × amd64/arm64）
#   2. desktop（macos-15）：Wails macOS .app（内嵌 agent-browser）+ p12 签名 + zip/SHA256 上传
#   3. desktop-windows（windows-latest）：Wails Windows cdproxy.exe + zip/SHA256 上传
#   4. manifest（ubuntu-latest）：合并 macOS + Windows 产物统一签发 Ed25519 manifest.json 并验签上传
#   5. homebrew（ubuntu-latest）：可选自动回写 yangyaofei/homebrew-tap（未配置 HOMEBREW_TAP_TOKEN 时提示并跳过）
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (例如 v0.10.0；手动运行需该 tag 已存在或仅用于补传桌面资产)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: 质量门禁（CLI 与核心包）
        run: |
          go vet ./cmd/... ./internal/...
          go test -count=1 ./cmd/... ./internal/...

      - name: 发布（GoReleaser 全平台 CLI）
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS 桌面 App（Wails v3）：构建、内嵌 agent-browser、p12 签名并上传产物
  desktop:
    runs-on: macos-15
    needs: [release]
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install wails3 CLI (pinned)
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Build frontend deps
        run: npm ci
        working-directory: desktop/frontend

      - name: Restore updater public key (from Secret; never in repo)
        run: |
          if [ -z "${{ secrets.UPDATER_PUBLIC_KEY }}" ]; then
            echo "::error::缺少 UPDATER_PUBLIC_KEY Secret"
            exit 1
          fi
          mkdir -p ../certs
          echo "${{ secrets.UPDATER_PUBLIC_KEY }}" | base64 -d > ../certs/updater.key.pub

      - name: Build + embed agent-browser (version injected)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p frontend/dist
          wails3 task package:embedded VERSION="${VERSION#v}"

      - name: Restore signing cert (AES p12, shared with denpa-jack)
        run: |
          if [ -z "${{ secrets.CDPROXY_CERT_P12_BASE64 }}" ] || [ -z "${{ secrets.CDPROXY_CERT_PASSWORD }}" ]; then
            echo "::error::缺少 CDPROXY_CERT_P12_BASE64 / CDPROXY_CERT_PASSWORD Secret"
            exit 1
          fi
          mkdir -p ../certs
          echo "${{ secrets.CDPROXY_CERT_P12_BASE64 }}" | base64 -d > ../certs/ci.p12

      - name: Codesign with p12 (after embed — covers bundled binary)
        run: wails3 tool sign --input "bin/cdproxy.app" --certificate ../certs/ci.p12 --password "${{ secrets.CDPROXY_CERT_PASSWORD }}"

      - name: Guard — signature authority must be stable
        run: |
          codesign --verify --deep --strict "bin/cdproxy.app"
          DV="$(codesign -dvv "bin/cdproxy.app" 2>&1 || true)"
          case "$DV" in
            *"Authority=Denpa Jack Dev"*) echo "签名身份 ✓ Denpa Jack Dev" ;;
            *) echo "::error::签名身份不是 Denpa Jack Dev（TCC/更新连续性破坏），拒绝发布"; printf '%s\n' "$DV" | head -6; exit 1 ;;
          esac

      - name: Package update artifact (zip of signed .app)
        run: |
          mkdir -p ../dist
          ditto -c -k --keepParent "bin/cdproxy.app" "../dist/cdproxy_${VERSION#v}_darwin_arm64.zip"

      - name: Checksums
        run: cd ../dist && shasum -a 256 -- *.zip > SHA256SUMS_darwin.txt

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$VERSION" ../dist/cdproxy_*_darwin_arm64.zip ../dist/SHA256SUMS_darwin.txt --clobber

      - name: Stage artifact for unified updater manifest
        uses: actions/upload-artifact@v4
        with:
          name: desktop-darwin
          path: dist/cdproxy_*_darwin_arm64.zip
          retention-days: 1

  # Windows 桌面 App（Wails v3）：构建 cdproxy.exe 并打包 zip 上传同一 Release
  desktop-windows:
    runs-on: windows-latest
    needs: [release]
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install wails3 CLI (pinned)
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install frontend deps
        working-directory: desktop/frontend
        run: npm ci

      - name: Restore updater public key (from Secret; never in repo)
        run: |
          New-Item -ItemType Directory -Force -Path ../certs, frontend/dist | Out-Null
          if ("${{ secrets.UPDATER_PUBLIC_KEY }}" -eq "") {
            Write-Error "缺少 UPDATER_PUBLIC_KEY Secret"
            exit 1
          }
          [IO.File]::WriteAllBytes("build/updater.key.pub", [Convert]::FromBase64String("${{ secrets.UPDATER_PUBLIC_KEY }}"))

      - name: Build Windows desktop binary (version injected)
        run: |
          $v = "${{ env.VERSION }}".TrimStart('v')
          wails3 task windows:build VERSION="$v" ARCH=amd64

      - name: Package & checksum
        run: |
          $v = "${{ env.VERSION }}".TrimStart('v')
          New-Item -ItemType Directory -Force -Path ../dist | Out-Null
          $zip = "../dist/cdproxy_${v}_windows_amd64.zip"
          Compress-Archive -Path "bin/cdproxy.exe" -DestinationPath $zip -Force
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  cdproxy_${v}_windows_amd64.zip" | Out-File -FilePath "../dist/SHA256SUMS_windows.txt" -Encoding ascii

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$env:VERSION" ../dist/cdproxy_*_windows_amd64.zip ../dist/SHA256SUMS_windows.txt --clobber

      - name: Stage artifact for unified updater manifest
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/cdproxy_*_windows_amd64.zip
          retention-days: 1

  # 统一更新清单：合并 macOS + Windows 桌面产物签发 Ed25519 manifest.json 并验签上传
  manifest:
    runs-on: ubuntu-latest
    needs: [desktop, desktop-windows]
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install wails3 CLI (purego)
        run: CGO_ENABLED=0 go install -tags purego github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Download macOS desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-darwin
          path: dist

      - name: Download Windows desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: dist

      - name: Generate & verify unified Ed25519 manifest.json (macOS + Windows)
        run: |
          if [ -z "${{ secrets.UPDATER_SIGNING_KEY }}" ] || [ -z "${{ secrets.UPDATER_PUBLIC_KEY }}" ]; then
            echo "::error::缺少 UPDATER_SIGNING_KEY / UPDATER_PUBLIC_KEY Secret"
            exit 1
          fi
          mkdir -p certs
          echo "${{ secrets.UPDATER_SIGNING_KEY }}" | base64 -d > certs/updater.key
          echo "${{ secrets.UPDATER_PUBLIC_KEY }}"  | base64 -d > certs/updater.key.pub
          ls -lh dist/
          wails3 updater manifest \
            -version "${VERSION#v}" \
            -key certs/updater.key \
            -output dist/manifest.json \
            -url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}" \
            dist/
          wails3 updater verify -manifest dist/manifest.json -publickey certs/updater.key.pub
          jq -e '[.artifacts[] | "\(.platform)/\(.arch)"] | (index("darwin/arm64") != null) and (index("windows/amd64") != null)' dist/manifest.json >/dev/null
          cat dist/manifest.json

      - name: Upload manifest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$VERSION" dist/manifest.json --clobber

  # 可选：自动回写 yangyaofei/homebrew-tap 的 Casks/cdproxy.rb
  homebrew:
    runs-on: ubuntu-latest
    needs: [release, desktop, manifest]
    if: always() && needs.manifest.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Update yangyaofei/homebrew-tap (optional via HOMEBREW_TAP_TOKEN)
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::未配置 HOMEBREW_TAP_TOKEN Secret，跳过自动更新 yangyaofei/homebrew-tap（配置具备 contents:write 权限的 PAT 后启用）"
            exit 0
          fi
          V="${VERSION#v}"
          mkdir -p tap-work/sums
          gh release download "$VERSION" -R "$GITHUB_REPOSITORY" -p "SHA256SUMS_darwin.txt" -D tap-work/sums --clobber

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/yangyaofei/homebrew-tap.git" tap-work/repo
          python3 - "$V" tap-work/sums tap-work/repo << 'PY'
          import re, sys
          from pathlib import Path

          ver, sums_dir, repo = sys.argv[1], Path(sys.argv[2]), Path(sys.argv[3])

          def parse_sums(path: Path) -> dict[str, str]:
              out = {}
              if not path.exists():
                  return out
              for line in path.read_text(encoding="utf-8").splitlines():
                  parts = line.strip().split()
                  if len(parts) >= 2:
                      out[Path(parts[1]).name] = parts[0]
              return out

          desk_sums = parse_sums(sums_dir / "SHA256SUMS_darwin.txt")
          desk_fname = f"cdproxy_{ver}_darwin_arm64.zip"
          desk_sha = desk_sums.get(desk_fname)
          if not desk_sha:
              raise SystemExit(f"SHA256SUMS_darwin.txt 缺少 {desk_fname}")
          cp = repo / "Casks" / "cdproxy.rb"
          ctxt = cp.read_text(encoding="utf-8")
          ctxt, n1 = re.subn(r'version "[^"]+"', f'version "{ver}"', ctxt, count=1)
          ctxt, n2 = re.subn(r'sha256 "[0-9a-f]{64}"', f'sha256 "{desk_sha}"', ctxt, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Casks/cdproxy.rb 替换失败")
          cp.write_text(ctxt, encoding="utf-8")
          print(f"Updated Casks/cdproxy.rb -> {ver} ({desk_sha[:12]}...)")
          PY

          cd tap-work/repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/cdproxy.rb
          if git diff --cached --quiet; then
            echo "homebrew-tap 已是最新版本，无需提交"
          else
            git commit -m "cdproxy: bump to v${V}"
            git push origin HEAD:main
          fi
