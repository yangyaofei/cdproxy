name: CI

# 持续集成：push master / PR / 手动。
# 两条并行作业：
#   - core（ubuntu-latest）：密钥守卫 + 前端/扩展语法 + Wails 绑定生成 + 前端同步构建 + Go 核单测 + Windows 交叉构建校验
#   - desktop-macos（macos-15）：Wails macOS CGO 桌面宿主绑定生成 + 编译验签前检查
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Tracked-file guard
        run: |
          fail=0

          tracked_secret=$(git ls-files | grep -iE '(^|/)(secrets?\.env.*|.*\.p12|.*\.pw|.*\.pem|.*\.key|.*\.jks)$|(^|/)certs/' || true)
          if [ -n "$tracked_secret" ]; then
            echo "::error::疑似凭据/密钥文件被跟踪（私钥只进 GitHub Secrets，本地放 certs/ 且被 ignore；.pub 公钥除外）："
            echo "$tracked_secret" | head -5
            fail=1
          fi

          tracked_tmp=$(git ls-files tmp/ || true)
          if [ -n "$tracked_tmp" ]; then
            echo "::error::tmp/ 下不应有被跟踪的文件（忽略规则对已跟踪文件无效）："
            echo "$tracked_tmp" | head -5
            fail=1
          fi

          [ "$fail" -eq 0 ] && echo "通过：没有被误跟踪的凭据/临时文件"
          exit $fail

      # Linux runner 无 gtk4/webkitgtk 头文件；-tags purego + CGO_ENABLED=0 纯 Go 编译 CLI（仅需 generate bindings）
      - name: Install wails3 CLI (pinned)
        run: CGO_ENABLED=0 go install -tags purego github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: JS syntax, Wails bindings, admin sync & frontend build
        run: |
          node --check static/admin/i18n.js
          node --check static/admin/app.js
          node --check ext/cdp-ext/sw.js
          node --check ext/cdp-ext/config-ui.js
          mkdir -p desktop/frontend/dist
          if [ ! -f desktop/build/updater.key.pub ]; then
            printf -- "-----BEGIN PLACEHOLDER PUBLIC KEY-----\nci build placeholder\n-----END PLACEHOLDER PUBLIC KEY-----\n" > desktop/build/updater.key.pub
          fi
          (cd desktop && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 wails3 generate bindings -clean=true -time-type=Date)
          python3 scripts/sync_admin_frontend.py
          python3 scripts/sync_admin_frontend.py --check
          (cd desktop/frontend && npm ci && npm run build)

      - name: Go vet + unit tests + Windows desktop cross-check
        run: |
          go vet ./cmd/... ./internal/...
          go test -count=1 ./cmd/... ./internal/...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./cmd/... ./internal/... ./desktop
          mkdir -p desktop/bin
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X main.version=ci" -o desktop/bin/cdproxy.exe ./desktop

  desktop-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install wails3 CLI (pinned)
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Generate bindings & build desktop frontend
        run: |
          mkdir -p desktop/frontend/dist
          if [ ! -f desktop/build/updater.key.pub ]; then
            printf -- "-----BEGIN PLACEHOLDER PUBLIC KEY-----\nci build placeholder\n-----END PLACEHOLDER PUBLIC KEY-----\n" > desktop/build/updater.key.pub
          fi
          (cd desktop && wails3 generate bindings -clean=true -time-type=Date)
          python3 scripts/sync_admin_frontend.py
          (cd desktop/frontend && npm ci && npm run build)

      - name: Vet & compile macOS desktop host
        run: |
          go vet ./desktop
          mkdir -p desktop/bin
          CGO_ENABLED=1 go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -X main.version=ci" -o desktop/bin/cdproxy ./desktop
