# GoReleaser 发布配置
#
# 触发：push tag v*（.github/workflows/release.yml）
# 产物：全平台 CLI 二进制（darwin/linux/windows × amd64/arm64）+ 归档 + SHA256SUMS
# Homebrew 分发维护在 yangyaofei/homebrew-tap（Casks/cdproxy.rb）。
version: 2

project_name: cdproxy

builds:
  - id: cdproxy
    main: ./cmd/cdproxy
    binary: cdproxy
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    name_template: >-
      cdproxy-cli-{{ .Version }}-{{ .Os }}-{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - README.zh.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
