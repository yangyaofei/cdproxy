version: '3'

vars:
  APP_NAME: "cdproxy-desktop"
  # 版本注入：wails3 task package:embedded VERSION=1.2.3（CI 从 tag 取）；
  # 默认 dev。updater 的 CurrentVersion 依赖它做 semver 比较。
  VERSION: '{{.VERSION | default "dev"}}'
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  # 完整打包：准备内嵌 agent-browser（下载+校验+staging）→ .app →
  # 拷入 Resources/agent-browser/（OpenChamber 模式：二进制随包走，
  # 升级=换包）→ ad-hoc 重签整包（内嵌二进制须被签名链覆盖）
  package:embedded:
    summary: Packages .app with embedded agent-browser binary
    deps:
      - task: prepare:agent-browser
    cmds:
      - task: darwin:package
      - task: embed:agent-browser

  prepare:agent-browser:
    summary: Download/verify/stage embedded agent-browser (pinned)
    cmds:
      - python3 --version
      - ../scripts/prepare_agent_browser.sh

  embed:agent-browser:
    summary: Copy staged agent-browser into the packaged .app Resources + inject version
    platforms: [darwin]
    cmds:
      - rm -rf "bin/{{.APP_NAME}}.app/Contents/Resources/agent-browser"
      - mkdir -p "bin/{{.APP_NAME}}.app/Contents/Resources/agent-browser"
      - cp build/agent-browser/agent-browser "bin/{{.APP_NAME}}.app/Contents/Resources/agent-browser/agent-browser"
      - chmod 755 "bin/{{.APP_NAME}}.app/Contents/Resources/agent-browser/agent-browser"
      # 版本注入 Info.plist（updater 语义：CFBundleShortVersionString 与
      # manifest.json version 一致；main.version 已在编译期 -X 注入）
      - /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString {{.VERSION}}" -c "Set :CFBundleVersion {{.VERSION}}" "bin/{{.APP_NAME}}.app/Contents/Info.plist"
      # embed 后整包 ad-hoc 重签（内嵌二进制纳入签名链；正式 p12 签名由
      # CI/本地 sign:release 在此之后覆盖）
      - codesign --force --deep --sign - "bin/{{.APP_NAME}}.app"
      - bin/{{.APP_NAME}}.app/Contents/Resources/agent-browser/agent-browser --version

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
