<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agent-browser-proxy · Admin</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
</head>
<body>
  <div x-data="admin()" x-init="init()">
    <header>
      <h1>agent-browser-proxy</h1>
      <div class="health" :class="healthy ? 'ok' : 'bad'">
        <span x-text="healthy ? '● 服务在线' : '● 服务离线'"></span>
      </div>
    </header>

    <!-- 基座 -->
    <section>
      <h2>基座 Chrome</h2>
      <template x-if="status">
        <div>
          <table class="kv">
            <tr><td>状态</td><td><span class="pill" :class="status.keeper.chrome === 'alive' ? 'ok' : 'bad'" x-text="status.keeper.chrome"></span></td></tr>
            <tr><td>调试端口</td><td x-text="status.keeper.cdp_port"></td></tr>
            <tr><td>Profile</td><td><code x-text="status.keeper.profile"></code></td></tr>
            <tr><td>Chrome</td><td><code x-text="status.keeper.chrome_path"></code></td></tr>
            <tr><td>下游连接</td><td x-text="status.downstream"></td></tr>
          </table>
          <button class="warn" @click="restartKeeper()" :disabled="busy">重启基座</button>
          <span class="hint">重启会断开所有会话（daemon 自动重连重新分配）</span>
        </div>
      </template>
    </section>

    <!-- 会话 -->
    <section>
      <h2>会话 <span class="count" x-text="status ? status.sessions.length : 0"></span></h2>
      <table class="list" x-show="status && status.sessions.length">
        <thead><tr><th>名称</th><th>连接</th><th>名下 tab</th><th></th></tr></thead>
        <tbody>
          <template x-for="s in (status ? status.sessions : [])" :key="s.name">
            <tr>
              <td x-text="s.name"></td>
              <td><span class="pill" :class="s.connected ? 'ok' : 'idle'" x-text="s.connected ? '已连接' : '空闲'"></span></td>
              <td x-text="s.targets"></td>
              <td><button class="danger sm" @click="release(s.name)" :disabled="busy">释放</button></td>
            </tr>
          </template>
        </tbody>
      </table>
      <p class="hint" x-show="status && !status.sessions.length">暂无会话</p>
    </section>

    <!-- 设置 -->
    <section>
      <h2>运行时设置</h2>
      <table class="kv form">
        <tr>
          <td><label for="s-disconnect">断连回收宽限（秒）</label></td>
          <td>
            <input id="s-disconnect" type="number" min="5" step="1"
                   x-model="form.disconnect_reap_seconds">
            <span class="hint">上游断连后多久回收会话与名下 tab（容忍 daemon 重启）</span>
          </td>
        </tr>
        <tr>
          <td><label for="s-alloc">未连接回收（秒）</label></td>
          <td>
            <input id="s-alloc" type="number" min="5" step="1"
                   x-model="form.alloc_reap_seconds">
            <span class="hint">分配后从未连接的回收时限（防泄漏）</span>
          </td>
        </tr>
      </table>
      <div>
        <button class="primary" @click="saveSettings()" :disabled="busy || !dirty()">保存设置</button>
        <span class="hint">保存即生效并持久化（var/settings.json）</span>
        <span class="ok-text" x-show="savedAt" x-text="'已保存 ' + savedAt"></span>
      </div>
    </section>

    <!-- 日志 -->
    <section>
      <h2>日志尾部 <button class="sm" @click="loadLogs()" :disabled="busy">刷新</button></h2>
      <pre class="logs" x-text="logs.length ? logs.join('\n') : '（暂无日志）'"></pre>
    </section>

    <!-- 危险区 -->
    <section class="danger-zone">
      <h2>停机</h2>
      <button class="danger" @click="shutdown()" :disabled="busy">停止服务</button>
      <span class="hint">基座 Chrome 不受影响（keeper 独立管理，可用 scripts/serve.sh 重新拉起服务）</span>
    </section>
  </div>
</body>
</html>
