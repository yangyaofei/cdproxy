[project]
name = "agent-browser-proxy"
version = "0.1.0"
description = "agent-browser 共享 Chrome 的 CDP 转发代理：会话级 tab 归属隔离 + 基座生命周期一体管理"
requires-python = ">=3.12"
dependencies = [
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
agent-browser-proxy = "agent_browser_proxy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: 单元测试（无外部依赖）",
    "e2e: 端到端测试（需真实 Chrome，见 scripts/smoke_test.py）",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true

[tool.hatch.build.targets.wheel]
packages = ["src/agent_browser_proxy"]
