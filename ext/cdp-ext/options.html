<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title data-i18n="optionsPageTitle">cdp-ext Settings</title>
  <style>
    body { font: 14px/1.6 system-ui, sans-serif; max-width: 480px; margin: 32px auto; padding: 0 16px; }
    label { display: block; margin: 16px 0 4px; font-weight: 600; }
    input, select { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; }
    button { margin-top: 20px; padding: 6px 20px; font: inherit; cursor: pointer; }
    #saved { color: #080; margin-left: 12px; visibility: hidden; }
  </style>
</head>
<body>
  <h2 data-i18n="optionsHeading">cdp-ext Reverse Bridge Settings</h2>
  <p>
    <span data-i18n="optionsIntroPrefix">Connects outbound to cdproxy (</span><code>extension</code><span data-i18n="optionsIntroSuffix"> source) and bridges your everyday Chrome as a Tab-Group-isolated CDP downstream.</span>
  </p>
  <label for="relayUrl" data-i18n="labelRelayUrl">Proxy Reverse Endpoint (WebSocket URL)</label>
  <input id="relayUrl" placeholder="ws://127.0.0.1:9225/ext" />
  <label for="token" data-i18n="labelToken">Access Token (matches cdproxy Sources &amp; Endpoints)</label>
  <input id="token" placeholder="dev" />
  <label for="releasePolicy" data-i18n="labelReleasePolicy">When a session is released, what happens to its tabs?</label>
  <select id="releasePolicy">
    <option value="close" data-i18n="policyClose">Close all tabs and remove the group (default)</option>
    <option value="mark" data-i18n="policyMark">Keep tabs, mark group as released (grey · released)</option>
    <option value="keep" data-i18n="policyKeep">Keep tabs and group untouched</option>
  </select>
  <button id="save" data-i18n="saveButton">Save</button>
  <span id="saved" data-i18n="savedNotice">Saved</span>
  <script src="options.js"></script>
</body>
</html>
