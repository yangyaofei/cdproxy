<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>cdp-ext 设置</title>
  <style>
    body { font: 14px/1.6 system-ui, sans-serif; max-width: 480px; margin: 32px auto; padding: 0 16px; }
    label { display: block; margin: 16px 0 4px; font-weight: 600; }
    input, select { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; }
    button { margin-top: 20px; padding: 6px 20px; font: inherit; cursor: pointer; }
    #saved { color: #080; margin-left: 12px; visibility: hidden; }
  </style>
</head>
<body>
  <h2>cdp-ext 反向桥设置</h2>
  <p>扩展会反向拨出到 cdproxy（<code>extension</code> 下游源），把当前浏览器桥接为代理的标签组隔离下游。</p>
  <label for="relayUrl">Proxy 反向入口（WebSocket URL）</label>
  <input id="relayUrl" placeholder="ws://127.0.0.1:9225/ext" />
  <label for="token">连接令牌（与 cdproxy「源与接入点」令牌一致）</label>
  <input id="token" placeholder="dev" />
  <label for="releasePolicy">会话释放时组内标签页怎么办</label>
  <select id="releasePolicy">
    <option value="close">全部关闭并删除组（默认）</option>
    <option value="mark">保留标签页，组标记为已释放（灰色 · released）</option>
    <option value="keep">完全保留，不做任何改动</option>
  </select>
  <button id="save">保存</button>
  <span id="saved">已保存</span>
  <script src="options.js"></script>
</body>
</html>
